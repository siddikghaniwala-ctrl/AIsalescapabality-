<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Capability Command Center · Tata Capital</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --gold: #c9a24b;
      --on-ai: #fff;
      --card: #fff;
      --ink: #0f1b2d;
      --muted: #566176;
      --line: #e5e0d3;
      --navy: #0b1f3a;
      --navy2: #16417a;
      --t0: #9ec5f4;
      --t1: #5598e7;
      --t2: #256abf;
      --t3: #0d366b;
      --f0: #06203f;
      --f1: #06203f;
      --f2: #fff;
      --f3: #fff;
      --ai: #8a6a1f;
      --ai-bg: #f7efd6;
      --ok: #0a7a3b;
      --ok-bg: #e1f4e8;
      --warn: #8a5a00;
      --warn-bg: #fdf0cf;
      --bad: #b3261e;
      --bad-bg: #fbe5e2;
      --fd: "Georgia", "Source Serif 4", serif;
      --fb: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --fm: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0d1118;
        --card: #161c26;
        --ink: #eef1f6;
        --muted: #a6b0c2;
        --line: #2a3342;
        --navy: #0a1730;
        --t0: #1c5cab;
        --t1: #3987e5;
        --t2: #6da7ec;
        --t3: #9ec5f4;
        --f0: #fff;
        --f1: #04152b;
        --f2: #04152b;
        --f3: #04152b;
        --ai: #e3c374;
        --ai-bg: #2e2712;
        --on-ai: #1a1405;
        --ok: #5fd18a;
        --ok-bg: #12301f;
        --warn: #f0c15a;
        --warn-bg: #3a2d0c;
        --bad: #ff958d;
        --bad-bg: #3d1714;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--fb); }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
    button { font: inherit; color: inherit; cursor: pointer; }
    .hero {
      background: radial-gradient(900px 300px at 85% -20%, rgba(201,162,75,.22), transparent 60%), linear-gradient(135deg, var(--navy), var(--navy2));
      color: #fff; padding: 18px 0 24px; border-bottom: 3px solid var(--gold);
    }
    .hero-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
    .wordmark { font: 600 13px var(--fm); letter-spacing: .28em; color: #fff; }
    .logo { height: 34px; display: block; background: #fff; border-radius: 6px; padding: 4px 8px; }
    .presentbtn {
      border: 1px solid var(--gold); background: var(--gold); color: #1a1405;
      border-radius: 99px; padding: 8px 18px; font-weight: 700; font-size: 13.5px;
    }
    .presentbtn:hover { filter: brightness(1.08); }
    .eyebrow { font: 600 11px var(--fm); letter-spacing: .12em; text-transform: uppercase; color: #e3c374; }
    .hero h1 { font: 600 30px/1.15 var(--fd); margin: 8px 0 6px; max-width: 26ch; }
    .hero p { margin: 0; opacity: .88; max-width: 60ch; }
    .ai-tag {
      display: inline-block; margin-top: 12px; padding: 3px 10px; border-radius: 99px;
      background: rgba(227,195,116,.16); border: 1px solid rgba(227,195,116,.5); color: #f3e2b0; font: 600 12px var(--fb);
    }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 18px; }
    .kpi {
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16);
      border-top: 2px solid var(--gold); border-radius: 12px; padding: 12px 14px;
    }
    .kpi small { display: block; font: 600 11px var(--fm); letter-spacing: .06em; text-transform: uppercase; opacity: .75; }
    .kpi b { display: block; font: 600 28px/1.15 var(--fd); margin-top: 2px; }
    .kpi span { font-size: 12.5px; opacity: .8; }
    .rail { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); }
    .rail .wrap { display: flex; gap: 4px; overflow-x: auto; padding-block: 8px; }
    .
