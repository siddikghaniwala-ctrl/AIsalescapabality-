<title>Capability Command Center</title>
<style>
:root{--bg:#f6f4ef;--gold:#c9a24b;--on-ai:#fff;--card:#fff;--ink:#0f1b2d;--muted:#566176;--line:#e5e0d3;--navy:#0b1f3a;--navy2:#16417a;
--t0:#9ec5f4;--t1:#5598e7;--t2:#256abf;--t3:#0d366b;--f0:#06203f;--f1:#06203f;--f2:#fff;--f3:#fff;
--ai:#8a6a1f;--ai-bg:#f7efd6;--ok:#0a7a3b;--ok-bg:#e1f4e8;--warn:#8a5a00;--warn-bg:#fdf0cf;--bad:#b3261e;--bad-bg:#fbe5e2;
--fd:"Georgia","Source Serif 4",serif;--fb:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--fm:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1118;--card:#161c26;--ink:#eef1f6;--muted:#a6b0c2;--line:#2a3342;--navy:#0a1730;
--t0:#1c5cab;--t1:#3987e5;--t2:#6da7ec;--t3:#9ec5f4;--f0:#fff;--f1:#04152b;--f2:#04152b;--f3:#04152b;
--ai:#e3c374;--ai-bg:#2e2712;--on-ai:#1a1405;--ok:#5fd18a;--ok-bg:#12301f;--warn:#f0c15a;--warn-bg:#3a2d0c;--bad:#ff958d;--bad-bg:#3d1714}}
:root[data-theme="dark"]{--bg:#0d1118;--card:#161c26;--ink:#eef1f6;--muted:#a6b0c2;--line:#2a3342;--navy:#0a1730;
--t0:#1c5cab;--t1:#3987e5;--t2:#6da7ec;--t3:#9ec5f4;--f0:#fff;--f1:#04152b;--f2:#04152b;--f3:#04152b;
--ai:#e3c374;--ai-bg:#2e2712;--on-ai:#1a1405;--ok:#5fd18a;--ok-bg:#12301f;--warn:#f0c15a;--warn-bg:#3a2d0c;--bad:#ff958d;--bad-bg:#3d1714}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--fb)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
button{font:inherit;color:inherit;cursor:pointer}
.hero{background:radial-gradient(900px 300px at 85% -20%,rgba(201,162,75,.22),transparent 60%),linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:18px 0 24px;border-bottom:3px solid var(--gold)}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.wordmark{font:600 13px var(--fm);letter-spacing:.28em;color:#fff}.logo{height:34px;display:block;background:#fff;border-radius:6px;padding:4px 8px}
.presentbtn{border:1px solid var(--gold);background:var(--gold);color:#1a1405;border-radius:99px;padding:8px 18px;font-weight:700;font-size:13.5px}.presentbtn:hover{filter:brightness(1.08)}
.eyebrow{font:600 11px var(--fm);letter-spacing:.12em;text-transform:uppercase;color:#e3c374}
.hero h1{font:600 30px/1.15 var(--fd);margin:8px 0 6px;max-width:26ch}
.hero p{margin:0;opacity:.88;max-width:60ch}
.ai-tag{display:inline-block;margin-top:12px;padding:3px 10px;border-radius:99px;background:rgba(227,195,116,.16);border:1px solid rgba(227,195,116,.5);color:#f3e2b0;font:600 12px var(--fb)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:18px}
.kpi{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-top:2px solid var(--gold);border-radius:12px;padding:12px 14px}
.kpi small{display:block;font:600 11px var(--fm);letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.kpi b{display:block;font:600 28px/1.15 var(--fd);margin-top:2px}
.kpi span{font-size:12.5px;opacity:.8}
.rail{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.rail .wrap{display:flex;gap:4px;overflow-x:auto;padding-block:8px}
.tab{flex:0 0 auto;border:1px solid transparent;background:none;border-radius:10px;padding:7px 12px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.tab i{font:600 11px var(--fm);font-style:normal;margin-right:6px;padding:1px 6px;border-radius:99px;background:var(--line)}
.tab[aria-selected="true"]{background:var(--navy);color:#fff;box-shadow:inset 0 -3px 0 var(--gold)}.tab[aria-selected="true"] i{background:rgba(255,255,255,.2)}
.panel{padding:20px 0 56px}.panel[hidden]{display:none}
.ph{margin:0 0 14px}.ph h2{font:600 26px/1.2 var(--fd);margin:0}.ph h2::after{content:"";display:block;width:46px;height:3px;background:var(--gold);margin-top:8px;border-radius:2px}.ph p{margin:4px 0 0;color:var(--muted)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0;box-shadow:0 1px 2px rgba(10,27,52,.05),0 10px 24px -14px rgba(10,27,52,.2)}
.card h3{margin:0 0 6px;font-size:15px}
.lbl{font:600 11px var(--fm);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.big{font:600 30px/1.1 var(--fd);margin:4px 0}
.muted{color:var(--muted)}.sm{font-size:13px}
.t0{background:var(--t0);color:var(--f0)}.t1{background:var(--t1);color:var(--f1)}.t2{background:var(--t2);color:var(--f2)}.t3{background:var(--t3);color:var(--f3)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;white-space:nowrap}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font:600 12px var(--fb);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.flat{background:var(--line);color:var(--muted)}.pill.ai{background:var(--ai-bg);color:var(--ai)}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px}
.step{text-align:left;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:12px;padding:12px;box-shadow:0 10px 24px -16px rgba(10,27,52,.25)}
.step:hover{border-color:var(--ai)}
.step .sn{font:600 11px var(--fm);color:var(--ai);white-space:nowrap}.step .sn .pill{padding:1px 7px}.step b{display:block;margin:2px 0}.step span{font-size:13px;color:var(--muted);display:block}
.loop{margin-top:10px;padding:10px 14px;border-radius:10px;background:var(--ai-bg);color:var(--ai);font-weight:600;font-size:14px}
.stack{display:flex;height:34px;border-radius:8px;overflow:hidden;gap:2px;margin:6px 0}
.stack i{display:flex;align-items:center;justify-content:center;font:600 12px var(--fm);font-style:normal;min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 11px var(--fm);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:0 0 12px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:var(--card);padding:7px 14px;font-weight:600;font-size:13.5px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 14px;font-weight:600;font-size:13.5px}
.btn.pri{background:var(--ai);border-color:var(--ai);color:var(--on-ai)}.btn:disabled{opacity:.5;cursor:default}
.bars{display:grid;gap:6px}
.rrow{display:grid;grid-template-columns:140px minmax(0,1fr) 92px;gap:10px;align-items:center;padding:6px 8px;border-radius:8px;border:1px solid transparent;background:none;width:100%;text-align:left}
.rrow:hover,.rrow[aria-pressed="true"]{border-color:var(--ai);background:var(--card)}
.track{position:relative;height:14px;background:var(--line);border-radius:7px}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:7px}
.track b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.5}
.track em{position:absolute;top:-2px;width:11px;height:18px;margin-left:-5px;border-radius:3px;border:2px solid var(--card)}
.axis{position:relative;height:16px;margin:0 110px 0 158px;font:11px var(--fm);color:var(--muted)}
.axis span{position:absolute;transform:translateX(-50%)}
.mail{white-space:pre-wrap;font:13.5px/1.55 var(--fb);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;margin:8px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.msgs{max-height:340px;overflow-y:auto;display:grid;gap:8px;padding:4px 2px}
.msg{padding:9px 12px;border-radius:10px;max-width:88%;white-space:pre-wrap}
.msg.ai{background:var(--ai-bg);justify-self:start}.msg.me{background:var(--bg);border:1px solid var(--line);justify-self:end}
.inp{display:flex;gap:8px;margin-top:10px}
.inp textarea{flex:1;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;resize:vertical;min-height:44px}
.dv{display:grid;grid-template-columns:130px minmax(0,1fr) minmax(0,1fr) 90px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.err{padding:12px;border-radius:10px;background:var(--bad-bg);color:var(--bad);font-size:13px}
.src{font:600 11px var(--fb);padding:1px 7px;border-radius:99px;margin-left:6px;white-space:nowrap}
.src.ok{background:var(--ok-bg);color:var(--ok)}.src.warn{background:var(--warn-bg);color:var(--warn)}.src.info{background:var(--ai-bg);color:var(--ai)}
.note{padding:10px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:13.5px}
.logic{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:8px}
.lg{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
.rules{list-style:none;margin:6px 0 0;padding:0;font-size:13px;color:var(--muted)}.rules li{padding:2px 0}.rules li.hit{color:var(--ink);font-weight:700}
.lesson{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}.lh{margin-bottom:6px}
.chunk{display:grid;grid-template-columns:76px minmax(0,1fr) 56px;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--line);font-size:13.5px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 12px;margin:4px 0;font-size:13.5px}
.opt[aria-pressed="true"]{border-color:var(--ai);background:var(--ai-bg)}.opt.right{border-color:var(--ok);background:var(--ok-bg)}.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.score-row{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) 86px;gap:6px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}

#deck{position:fixed;inset:0;z-index:100;background:radial-gradient(900px 400px at 90% -10%,rgba(201,162,75,.2),transparent 60%),linear-gradient(135deg,#071326,#0e2a50);color:#fff;display:none;flex-direction:column}
#deck.on{display:flex}
.dk-top{display:flex;justify-content:space-between;align-items:center;padding:14px 28px;font:600 11px var(--fm);letter-spacing:.14em;text-transform:uppercase;color:#e3c374;gap:12px}
.dk-top button,.dk-foot button{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:99px;padding:6px 14px;font-size:12.5px;font-weight:600}
.dk-body{flex:1;display:flex;align-items:center;justify-content:center;padding:0 clamp(20px,6vw,90px);overflow:auto}
.slide{width:100%;max-width:1080px;padding:12px 0}
.slide h2{font:600 clamp(28px,4.4vw,54px)/1.08 var(--fd);margin:0 0 12px}
.slide h2 em{font-style:normal;color:#e3c374}
.slide .sub{font-size:clamp(15px,1.7vw,21px);opacity:.86;max-width:62ch;margin:0}
.dk-grid{display:grid;gap:14px;margin-top:26px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.dk-card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-top:2px solid #c9a24b;border-radius:14px;padding:16px 18px}
.dk-card .k{font:600 11px var(--fm);letter-spacing:.08em;text-transform:uppercase;color:#e3c374}
.dk-card b.n{display:block;font:600 clamp(26px,3.4vw,44px)/1.1 var(--fd);margin:6px 0}
.dk-card p{margin:0;font-size:14.5px;opacity:.85}
.dk-tag{display:inline-block;margin-top:18px;padding:4px 12px;border-radius:99px;border:1px solid rgba(227,195,116,.6);color:#f3e2b0;font-size:13px;font-weight:600}
.dkt0{background:#1c5cab;color:#fff}.dkt1{background:#3987e5;color:#04152b}.dkt2{background:#6da7ec;color:#04152b}.dkt3{background:#9ec5f4;color:#04152b}
.dk-card b.n,.dk-tier b.n{text-align:left}
.dk-tier{border-radius:14px;padding:16px 18px}.dk-tier b.n{display:block;font:600 clamp(30px,4vw,52px)/1.1 var(--fd)}
.dk-foot{display:flex;align-items:center;justify-content:space-between;padding:10px 28px 18px;gap:12px;flex-wrap:wrap}
.dk-dots{display:flex;gap:8px}.dk-dots button{width:10px;height:10px;padding:0;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:none}.dk-dots button[aria-current="true"]{background:#c9a24b;border-color:#c9a24b}
.dk-notes{margin:0 28px 6px;padding:10px 14px;border-radius:10px;background:rgba(255,255,255,.09);font-size:14px;display:none}.dk-notes.on{display:block}
.dk-list{margin:22px 0 0;padding:0;list-style:none;display:grid;gap:12px}.dk-list li{display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:start;font-size:clamp(15px,1.6vw,20px)}
.dk-list i{font:600 16px var(--fd);font-style:normal;width:34px;height:34px;border-radius:50%;background:#c9a24b;color:#1a1405;display:flex;align-items:center;justify-content:center}
@media (max-width:640px){.rrow{grid-template-columns:96px minmax(0,1fr) 62px}.axis{margin-left:114px;margin-right:80px}.dv{grid-template-columns:1fr 1fr}.score-row{grid-template-columns:1fr 70px}.score-row>span.muted{grid-column:1/-1;order:3}.hero h1{font-size:25px}}
</style>

 mehta:{name:"Mr. Rahul Mehta",tag:"Intermediate validation",who:"Senior manager at an IT firm in Pune. Wants an ₹8 lakh personal loan for home renovation. Blunt and rate-focused.",open:"Rohan, your offer is 12.5% with a 1.5% processing fee. My bank sent me a pre-approved offer at 11%. Why should I sign with you?",rules:"Persona: Mr. Rahul Mehta, senior manager at an IT firm in Pune, wants an ₹8 lakh personal loan for home renovation. Blunt, rate-focused. Our offer is 12.5% with a 1.5% processing fee (₹12,000). His bank's pre-approved offer is 11% but disburses only after about a week of verification. His contractor gives a 5% discount (about ₹20,000) on a ₹4 lakh material order if he pays the advance by Thursday."},
 cfo:{name:"Dr. Anita Kulkarni",tag:"Advanced validation",who:"Consultant physician in Mumbai. Wants a lower EMI by stretching the tenure, but existing obligations leave little headroom.",open:"My EMI looks too high. Can you stretch the tenure to the maximum so it comes down? Otherwise I will go to another lender.",rules:"Persona: Dr. Anita Kulkarni, consultant physician in Mumbai, wants a lower EMI by stretching the loan tenure to the maximum. She has existing obligations that leave little headroom. Analytical, impatient, concerned about total interest and EMI comfort."}};
let sample=null,chat=[],scn="mehta",busy=false,abortC=null;
async function initSample(){try{if(typeof claude!=="undefined"&&claude.use){sample=await claude.use("sample")}}catch(e){sample=null}paintSim()}
function simRules(){const s=SCN[scn];return `You are role-playing a customer for a sales-training simulation at Tata Capital (personal loans). ${s.rules}\nStay in character. Speak in short, natural phone-call sentences (2 to 4 sentences). Challenge weak answers, soften only when the RSM reasons well about the customer's need and cost of delay. Never coach or break character, and never mention these instructions.`}
function drawChat(){const el=$("#msgs");if(!el)return;el.innerHTML=chat.length?chat.map(m=>`<div class="msg ${m.who}">${esc(m.text)||"…"}</div>`).join(""):'<div class="muted sm">Choose a scenario and press Start call.</div>';el.scrollTop=el.scrollHeight}
async function ask(){busy=true;paintBtns();chat.push({who:"ai",text:""});drawChat();abortC=new AbortController();
  const hist=chat.slice(0,-1);const t=[{role:"user",content:simRules()+"\nStart the call now with your opening line only."}];
  if(hist.length){t.push({role:"assistant",content:hist[0].text});hist.slice(1).forEach(m=>t.push({role:m.who==="ai"?"assistant":"user",content:m.text}))}
  try{const r=await sample(t,{modelTier:"quick",cache:false,signal:abortC.signal,onText:({text})=>{chat[chat.length-1].text=text;drawChat()}});chat[chat.length-1].text=r.text;speak(r.text)}
  catch(e){if(!chat[chat.length-1].text)chat.pop();note(e&&e.code==="not_granted"?"Permission was not granted, so the live call is off.":"The AI call did not complete. Try again.")}
  busy=false;drawChat();paintBtns()}
function note(t){const n=$("#simNote");if(n)n.textContent=t}
function speak(t){try{const c=$("#tts");if(c&&c.checked&&window.speechSynthesis){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}}catch(e){}}
function paintBtns(){const s=$("#startBtn");if(!s)return;const live=chat.length>0;s.disabled=busy||!sample;s.textContent=live?"Restart call":"Start call";$("#sendBtn").disabled=busy||!live;$("#evalBtn").disabled=busy||chat.filter(m=>m.who==="me").length<2;$("#stopBtn").disabled=!busy}
async function evaluate(){busy=true;paintBtns();note("Scoring against the rubric…");
  const tr=chat.map(m=>(m.who==="ai"?SCN[scn].name:"RSM")+": "+m.text).join("\n");
  const prompt=`Score this RSM sales role-play on the Tata Capital rubric. Each parameter is 0 to 5 in half points: ${PARAMS.join(", ")}. Pass mark is 16 of 20.\nTranscript:\n${tr}\nReturn JSON only: {"scores":[n,n,n,n],"feedback":["one line each, 4 items"],"strength":"one sentence","focus":"one sentence"}`;
  try{const j=await sample.json(prompt,{modelTier:"default",cache:false});const sc=(j.scores||[]).map(Number);const tot=sc.reduce((a,b)=>a+b,0);
    lastEval={sc,total:tot,fb:j.feedback||[],strength:j.strength||"",focus:j.focus||""};
    $("#evalOut").innerHTML=`<div class="card" style="margin-top:12px"><h3>Rubric result <span class="pill ${tot>=D.pass_mark?"ok":"bad"}">${tot>=D.pass_mark?"✓ Qualified":"! Not yet"} · ${tot}/20</span></h3>${PARAMS.map((p,i)=>`<div class="score-row sm"><b>${p}</b><span class="muted">${esc(lastEval.fb[i]||"")}</span><span class="n" style="white-space:nowrap">${sc[i]} / 5.0</span></div>`).join("")}<p style="margin:10px 0 0"><button class="btn pri" data-part="score">Open my scorecard</button></p></div>`;note("")}
  catch(e){note("Scoring did not complete. Try again.")}busy=false;paintBtns()}
function replayHTML(){
  const L=[["Mr. Mehta","ai",SCN.mehta.open],["Rohan Joshi","me","Mr. Mehta, your bank's offer needs about a week of verification, and your contractor's 5% discount on the ₹4 lakh material order ends Thursday. We disburse in 48 hours with minimal documentation. Will an extra 1.5% on the rate cost you more than missing a ₹20,000 discount?"],["Mr. Mehta","ai","The speed matters, yes. But your 1.5% processing fee costs me ₹12,000 upfront."],["Rohan Joshi","me","That fee covers digital KYC, doorstep document pickup and flexible prepayment after 6 months. The ₹20,000 you save this week is more than the fee, so the fee pays for itself immediately."]];
  return `<div class="card"><h3>Sample: Rohan Joshi vs Mr. Mehta</h3><div class="msgs" style="max-height:none">${L.map(m=>`<div class="msg ${m[1]}"><b class="sm">${m[0]}</b><br>${esc(m[2])}</div>`).join("")}</div></div>
  <div class="card" style="margin-top:12px"><h3>Scorecard</h3>${HB_RUBRIC()}<div class="sm muted" style="margin-top:8px">Result: promoted to Advanced.</div></div>`}
function cohortHTML(){
  const rows=D.emps.filter(e=>e.rp!==null).sort((a,b)=>b.rp-a.rp);
  return `<div class="card"><h3>Cohort scorecard: both bars must be cleared</h3><div class="muted sm">Role-play ≥ ${D.pass_mark}/20 and Day-60 incentive ≥ ${R.advanced}%.</div>
  ${rows.map(e=>{const g=e.rp>=D.pass_mark?"":`${r1(D.pass_mark-e.rp)} points short of the pass mark`;return `<div class="dv"><span><b>${e.name}</b><br><span class="muted sm">${e.territory}</span></span>
   <span><div class="lbl">Role-play ${e.rp}/20</div><div class="track"><i class="${e.rp_pass?"t2":"t0"}" style="width:${e.rp/20*100}%"></i><b style="left:${D.pass_mark/20*100}%"></b></div>${g?`<div class="sm muted">${g}</div>`:""}</span>
   <span><div class="lbl">Incentive ${e.post}%</div><div class="track"><i class="${e.inc_pass?"t2":"t0"}" style="width:${pos(e.post)}"></i><b style="left:${pos(R.advanced)}"></b></div></span>${pill(e.status)}</div>`}).join("")}
  <div class="muted sm" style="margin-top:8px">${G.cleared_n} cleared, ${G.escalate.length} escalated (${names(G.escalate.map(x=>x.name))}): repeat their weakest lessons with an Expert coach.</div></div>`}
function paintSim(){
  $("#p-sim").innerHTML=ph("Stage 5 · Assessment and Simulation: quiz, practise, scorecard","Three parts, in order. Your quiz result and call score feed the scorecard.")+
   seg("part",[["quiz","A · Knowledge quiz"],["sim","B · Simulation"],["score","C · Scorecard & feedback"]],state.part)+
   `<div>${state.part==="quiz"?quizHTML():state.part==="sim"?simPartHTML():scoreHTML()}</div>`;
  if(state.part==="sim"&&state.simTab==="live"){drawChat();paintBtns()}
}

/* ---------- Stage 6 Impact ---------- */
function ba(e){return `<tr><td><b>${e.name}</b><br><span class="muted sm">${e.territory}</span></td><td>${chip(e.diag)}<div class="muted sm">${e.att}%</div></td><td>${chip(e.diag_after)}<div class="muted sm">${e.post}%</div></td><td>${pill(e.status)}</td><td class="sm">${esc(e.next)}</td></tr>`}
function drawImp(){
  const v=state.impV;let body="";
  if(v==="OUT"){
    const tr=D.emps.filter(e=>e.rp!==null),avgrp=r1(tr.reduce((a,e)=>a+e.rp,0)/tr.length);
    body=`<div class="grid">
     <div class="card"><div class="lbl">Capability uplift</div><div class="big">${G.moved_up} of ${G.n} moved up</div>${SRC.match}
       <div class="lbl" style="margin-top:12px">Day 0</div>${stack(G.before)}<div class="lbl">Day 60</div>${stack(G.after)}<div class="sm muted">Meets the Advanced bar: ${G.meets_before} → ${G.meets_after} of ${G.n}.</div></div>
     <div class="card"><div class="lbl">Behavioural adoption</div><div class="big">${G.pass_n} of ${G.trained_n} passed</div>${SRC.match}
       <p class="sm" style="margin:10px 0 0">Role-play pass rate <b>${r1(G.pass_n/G.trained_n*100)}%</b> (pass mark ${D.pass_mark}/20).<br>Average role-play score <b>${avgrp} / 20</b>.<br>Quiz results appear here once learners complete Stage 5A.</p></div>
     <div class="card"><div class="lbl">Business outcomes</div><div class="big">${G.pre}% → ${G.post}%</div>${SRC.match}
       <p class="sm" style="margin:10px 0 0">Average incentive attainment, all ${G.n} RSMs.<br>Remediation group: <b>${G.inter_pre}% → ${G.inter_post}%</b>.<br>Conversion before: <b>${G.inter_conv_pre}%</b> ${SRC.match}<br>Conversion after, disbursal lift +${D.blueprint.disb_lift}% and book ₹${D.blueprint.book_cr} Cr: ${SRC.unverified}</p></div></div>
     <div class="note" style="margin-top:12px">These results are the handbook's worked example for this cohort. Business figures marked "Not in rows" need Finance validation.</div>`}
  else if(v==="West"||v==="South"){const g=D.groups[v],emps=D.emps.filter(e=>e.branch===v);
    body=`<div class="grid"><div class="card"><div class="lbl">Average incentive</div><div class="big">${g.pre}% → ${g.post}%</div></div><div class="card"><div class="lbl">Moved up a tier</div><div class="big">${g.moved_up} of ${g.n}</div></div><div class="card"><div class="lbl">Meets Advanced bar</div><div class="big">${g.meets_before} → ${g.meets_after}</div></div></div>
    <div class="card scroll" style="margin-top:12px"><table><thead><tr><th>RSM</th><th>Day 0</th><th>Day 60</th><th>Status</th><th>Next step</th></tr></thead><tbody>${emps.map(ba).join("")}</tbody></table></div>`}
  else if(v==="BU"){
    body=`<div class="card scroll"><table><thead><tr><th>Branch</th><th class="n">Avg before</th><th class="n">Avg after</th><th class="n">Cleared</th><th class="n">Moved up</th></tr></thead><tbody>${["West","South","BU"].map(k=>{const g=D.groups[k];return `<tr><td><b>${k==="BU"?"Whole BU":k}</b></td><td class="n">${g.pre}%</td><td class="n">${g.post}%</td><td class="n">${g.cleared_n} of ${g.inter_n}</td><td class="n">${g.moved_up}</td></tr>`}).join("")}</tbody></table></div>
    <div class="card" style="margin-top:12px"><h3>Escalations</h3>${G.escalate.map(x=>`<p class="sm" style="margin:4px 0"><span class="pill bad">! Escalate</span> <b>${x.name}</b>, ${x.territory}: role-play ${x.rp}/20, incentive ${x.att}% → ${x.post}%.</p>`).join("")}</div>`}
  else{
    const rows=D.recon.map(r=>`<tr><td>${r.metric}</td><td>${r.blueprint}</td><td class="sm">${r.rows}</td><td>${SRC[r.verdict]}</td></tr>`).join("");
    body=`<div class="card scroll"><h3>Data confidence</h3><table><thead><tr><th>Metric</th><th>Handbook</th><th>12 rows</th><th>Check</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="card" style="margin-top:12px"><h3>Suggested decisions</h3><ul class="sm"><li>Approve a second Module 2 cycle with 1:1 coaching for ${names(G.escalate.map(x=>x.name))}.</li><li>Ask Finance to validate the ₹${D.blueprint.book_cr} Cr book and +${D.blueprint.disb_lift}% lift against post-period disbursals.</li><li>Fix the handbook's 96.8% average (rows give ${D.all12_post}%).</li></ul></div>`}
  $("#p-imp").innerHTML=ph("Stage 6 · Impact Measurement: capability, behaviour, business","Same data, shown for each leader's decision.")+seg("impV",[["OUT","Outcomes"],["West","BM · West"],["South","BM · South"],["BU","BU Head"],["CXO","CXO"]],v)+body;
}
state.impV="OUT";


/* ---------- brand + presentation mode ---------- */
const brandHTML=()=>D.logo?`<img class="logo" src="${D.logo}" alt="Tata Capital">`:`<span class="wordmark">TATA CAPITAL</span>`;
const dkc=(k,n,p)=>`<div class="dk-card"><div class="k">${k}</div><b class="n">${n}</b><p>${p}</p></div>`;
const DKT={Beginner:"dkt0",Intermediate:"dkt1",Advanced:"dkt2",Expert:"dkt3"};
const SL=[
 ()=>`<div style="margin-bottom:26px">${brandHTML()}</div><h2>AI-Based <em>Sales Capability Development</em></h2><p class="sub">Six AI-automated stages take our Personal Loan RSMs from diagnosis to measured business impact.</p><span class="dk-tag">Learning &amp; Development · ${D.asof}</span>`,
 ()=>`<h2>Six <em>AI-automated stages</em></h2><p class="sub">Each stage feeds the next, and Day-60 results inform the next diagnosis.</p><div class="dk-grid">${[["1","Discovery","Benchmark from the existing competency framework."],["2","Diagnosis","Incentive earning linked to competency."],["3","Content Chunking","Bite-sized modules matched to each gap."],["4","Learning Intervention","Chunks scheduled with date, time, location."],["5","Assessment and Simulation","Quiz, role-play, then a scorecard."],["6","Impact","Capability, behaviour and business results."]].map(x=>dkc("Stage "+x[0],`<span style="font-size:.5em">${x[1]}</span>`,x[2])).join("")}</div>`,
 ()=>`<h2>Stages 1 and 2: every RSM <em>sorted in one pass</em></h2><p class="sub">The competency framework already exists for each role, grade and function. We link incentive earning to competency to see where each RSM stands today. ${G.inter_n} of ${G.n} are at or below 75% and are routed to remediation.</p><div class="dk-grid">${TIERS.map(k=>`<div class="dk-tier ${DKT[k]}"><div style="font:600 11px var(--fm);letter-spacing:.08em;text-transform:uppercase">${k} · ${RANGE[k]}</div><b class="n">${G.before[k]}</b><div style="font-size:14px">RSM${G.before[k]===1?"":"s"}</div></div>`).join("")}</div>`,
 ()=>{const a=D.plans["TC-101"],b=D.plans["TC-105"];return `<h2>Stage 3: <em>Content Chunking</em></h2><p class="sub">Each lesson becomes three short chunks: Learn, Practise, Apply. Each learner gets only what their diagnosis calls for.</p><div class="dk-grid">${dkc("Library","4 tiers","12 lessons and 4 dilemma caselets from one legacy manual.")}${dkc("Foundation track",a.n_chunks+" chunks",`${E("TC-101").first}: ${a.total_mins} minutes, starting with need and affordability discovery.`)}${dkc("Close to benchmark",b.n_chunks+" chunks",`${E("TC-105").first}: ${b.total_mins} minutes, starting with rate defense.`)}</div>`},
 ()=>{const w=D.plans["TC-101"].sessions,so=D.plans["TC-107"].sessions;return `<h2>Stage 4: <em>Learning Intervention</em></h2><p class="sub">Every chunked module is assigned and scheduled with a date, a time and a location.</p><div class="dk-grid">${dkc("West cohort",w[0].day+" & "+w[1].day,`${w[0].label.slice(4,10)} to ${w[3].label.slice(4,10)} · ${w[0].time} IST`)}${dkc("South cohort",so[0].day+" & "+so[1].day,`${so[0].label.slice(4,10)} to ${so[3].label.slice(4,10)} · ${so[0].time} IST`)}${dkc("Ready to send",PLANIDS.length+" invites","plus 2 manager action briefs with coaching questions.")}</div><span class="dk-tag">Proposed calendar · venues and links to be confirmed</span>`},
 ()=>`<h2>Stage 5: <em>Assessment and Simulation</em></h2><p class="sub">Quiz, then role-play, then a scorecard. Pass needs a role-play of ${D.pass_mark}/20 or more and a Day-60 incentive of ${R.advanced}% or more.</p><div class="dk-grid">${dkc("A · Knowledge quiz","5 questions","Checks the concepts before the call.")}${dkc("B · Simulation","Live call","AI plays the customer; the learner negotiates.")}${dkc("C · Scorecard","Feedback","Names the exact areas to improve.")}</div><span class="dk-tag">${G.cleared_n} of ${G.inter_n} cleared both bars · worked example: Rohan 17.0 / 20</span>`,
 ()=>{const tr=D.emps.filter(e=>e.rp!==null),av=r1(tr.reduce((a,e)=>a+e.rp,0)/tr.length);return `<h2>Stage 6: impact across <em>capability, behaviour, business</em></h2><p class="sub">Same data, three lenses.</p><div class="dk-grid">${dkc("Capability",G.meets_before+" → "+G.meets_after+" of "+G.n,"RSMs meeting the Advanced bar.")}${dkc("Behaviour",G.pass_n+" of "+G.trained_n+" pass",`Role-play pass rate; average ${av} / 20.`)}${dkc("Business",G.pre+"% → "+G.post+"%","Average incentive attainment, all 12 RSMs.")}</div><span class="dk-tag">Sample data · disbursal lift and book value await Finance validation</span>`},
 ()=>`<h2>Why this <em>matters</em></h2><div class="dk-grid">${dkc("Clear diagnosis",G.n+" RSMs","sorted in one pass, with the rule shown.")}${dkc("Personal learning","Short chunks","only what each learner's gap needs.")}${dkc("Proof of practice","Quiz + role-play","no one is cleared on attendance alone.")}${dkc("Measured results",G.meets_before+" → "+G.meets_after+" of "+G.n,"at the Advanced bar.")}</div><ul class="dk-list"><li><i>1</i><span>Approve a second Module 2 cycle with 1:1 coaching for ${names(G.escalate.map(x=>x.name))}.</span></li><li><i>2</i><span>Confirm training dates, venues and joining links.</span></li></ul>`];
const NOTES=["Open with the idea: AI-based sales capability development for personal loan RSMs, in six stages.","Walk the six stages. Day-60 results inform the next diagnosis.","Stress that the competency framework already exists by role, grade and function. We link incentive earning to competency to see current status. Define the tiers: Expert 100%+, Advanced 76 to 99, Intermediate 50 to 75, Beginner below 50.","Show the short tailored path: foundation learners take all nine chunks; those close to the benchmark skip to rate defense.","Learning intervention is concrete: dates, times, location. Say clearly that this is a proposed calendar.","Explain the three parts. Four of six cleared both the role-play and the incentive bar.","Three lenses. Be open that business figures beyond incentive are awaiting Finance validation.","Close with the benefits and the two next steps. Thank the audience and invite questions."];
let dk=0,dkT0=0,dkI=null;
function drawDeck(){
  $("#dkBody").innerHTML=`<div class="slide">${SL[dk]()}</div>`;
  $("#dkDots").innerHTML=SL.map((_,i)=>`<button data-slide="${i}" aria-label="Slide ${i+1}" aria-current="${i===dk}"></button>`).join("");
  $("#dkNotes").textContent=NOTES[dk];$("#dkBrand").textContent="Tata Capital · L&D · "+(dk+1)+" / "+SL.length;
}
function deckOpen(){dk=0;dkT0=Date.now();$("#deck").classList.add("on");document.body.style.overflow="hidden";
  clearInterval(dkI);dkI=setInterval(()=>{const s=Math.floor((Date.now()-dkT0)/1000);$("#dkTimer").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")},1000);
  try{const f=document.documentElement.requestFullscreen;if(f)f.call(document.documentElement).catch(()=>{})}catch(e){}drawDeck()}
function deckClose(){$("#deck").classList.remove("on");document.body.style.overflow="";clearInterval(dkI);try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}}
function deckGo(n){dk=Math.max(0,Math.min(SL.length-1,n));drawDeck()}
document.addEventListener("keydown",ev=>{if(!$("#deck").classList.contains("on"))return;
  const k=ev.key;if(k==="ArrowRight"||k===" "||k==="PageDown"){ev.preventDefault();deckGo(dk+1)}else if(k==="ArrowLeft"||k==="PageUp"){ev.preventDefault();deckGo(dk-1)}
  else if(k==="Escape")deckClose();else if(k==="Home")deckGo(0);else if(k==="End")deckGo(SL.length-1);else if(k==="n"||k==="N")$("#dkNotes").classList.toggle("on")});
try{$("#brand").innerHTML=brandHTML()}catch(e){}

/* ---------- boot (each panel isolated, so one failure never blanks the page) ---------- */
const DRAW={top:drawTop,ov:drawOv,disc:drawDisc,diag:drawDiag,chunk:drawChunk,train:drawTrain,sim:paintSim,imp:drawImp};
function safe(k){try{DRAW[k]()}catch(e){const el=k==="top"?$("#kpis"):$("#p-"+k);if(el)el.innerHTML=`<div class="err">This section could not load (${esc(e.message)}).</div>`}}
function redraw(k){safe(k)}
document.addEventListener("click",ev=>{
  try{
  const t=ev.target.closest("button");if(!t)return;
  if("present" in t.dataset)return deckOpen();
  if(t.dataset.deck){const d=t.dataset.deck;if(d==="exit")deckClose();else if(d==="next")deckGo(dk+1);else if(d==="prev")deckGo(dk-1);else if(d==="notes")$("#dkNotes").classList.toggle("on");return}
  if(t.dataset.slide)return deckGo(+t.dataset.slide);
  if(t.dataset.tab)return show(t.dataset.tab);
  if(t.dataset.go)return show(t.dataset.go);
  if(t.dataset.emp){state.diagSel=t.dataset.emp;return redraw("diag")}
  if(t.dataset.learner){state.learner=t.dataset.learner;redraw("chunk");redraw("train");return}
  if(t.dataset.part){state.part=t.dataset.part;return redraw("sim")}
  if(t.dataset.q){state.quiz.ans[t.dataset.q]=t.dataset.o;return redraw("sim")}
  if(t.dataset.quiz==="check"){state.quiz.done=true;return redraw("sim")}
  if(t.dataset.quiz==="reset"){state.quiz={ans:{},done:false};return redraw("sim")}
  const sg=t.closest("[data-seg]");
  if(sg){const n=sg.dataset.seg,k=t.dataset.k;
    if(n==="diagF"){state.diagF=k;redraw("diag")}else if(n==="briefB"){state.briefB=k;redraw("train")}
    else if(n==="impV"){state.impV=k;redraw("imp")}else if(n==="simTab"){state.simTab=k;redraw("sim")}
    else if(n==="part"){state.part=k;redraw("sim")}
    else if(n==="scn"){if(busy&&abortC)abortC.abort();scn=k;chat=[];busy=false;redraw("sim")}
    return}
  if(t.dataset.copy||t.dataset.copyId){const txt=t.dataset.copy?t.dataset.copy:$("#"+t.dataset.copyId).textContent;
    const done=ok=>{const o=t.textContent;t.textContent=ok?"Copied":"Select and copy manually";setTimeout(()=>t.textContent=o,1600)};
    try{navigator.clipboard.writeText(txt).then(()=>done(true),()=>done(false))}catch(e){done(false)}return}
  if(t.id==="startBtn"&&sample&&!busy){chat=[];$("#evalOut").innerHTML="";note("");ask()}
  if(t.id==="sendBtn"&&!busy){const i=$("#inp"),v=i.value.trim();if(!v)return;chat.push({who:"me",text:v});i.value="";drawChat();ask()}
  if(t.id==="stopBtn"&&abortC)abortC.abort();
  if(t.id==="evalBtn"&&!busy&&sample)evaluate();
  }catch(e){console.error(e)}
});
Object.keys(DRAW).forEach(safe);
initSample();
</script>
